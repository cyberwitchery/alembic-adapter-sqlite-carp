name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # the alembic release this adapter is checked against. every release attaches
  # static binaries, so the host jobs below need no rust toolchain and no build.
  # bump this deliberately: a red run then means a real protocol break, not
  # upstream noise.
  ALEMBIC_VERSION: v0.8.0
  # ubuntu-latest runners are x86_64.
  ALEMBIC_TARGET: x86_64-unknown-linux-gnu

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # the sqlite3 carp library links -lsqlite3; linux runners need the headers.
      - name: Install sqlite (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # setup-carp rewrites git@github.com: deps to https by default, so the
      # json and sqlite3 loads resolve without an ssh key on the runner.
      - name: Setup Carp
        uses: carpentry-org/setup-carp@v1

      - name: Build adapter
        run: carp -b alembic-sqlite.carp

      - name: Run unit tests
        run: carp -x test/adapter.carp

      # protocol-level e2e: drives the compiled binary over stdin/stdout.
      # rebuilds the binary itself (the unit-test run reuses the same out/ name).
      - name: Run e2e
        run: bash test/e2e.sh

  # protocol conformance: the runner that ships alongside alembic checks the
  # compiled adapter against the external-adapter contract.
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install sqlite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Fetch alembic-adapter-test
        run: |
          name="alembic-adapter-test-${ALEMBIC_VERSION}-${ALEMBIC_TARGET}"
          curl -sSfL -o runner.tar.gz \
            "https://github.com/cyberwitchery/alembic/releases/download/${ALEMBIC_VERSION}/${name}.tar.gz"
          tar xzf runner.tar.gz
          mkdir -p bin
          mv "${name}/alembic-adapter-test" bin/

      - name: Setup Carp
        uses: carpentry-org/setup-carp@v1

      - name: Build adapter
        run: carp -b alembic-sqlite.carp

      - name: Run conformance
        run: ./bin/alembic-adapter-test -- ./out/alembic-adapter-sqlite

  # real alembic-driven e2e: the actual cli spawns the adapter and converges an
  # inventory (plan/apply, idempotent re-plan, update, delete). linux-only.
  e2e-alembic:
    name: e2e (alembic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install sqlite
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Fetch the alembic cli
        run: |
          name="alembic-${ALEMBIC_VERSION}-${ALEMBIC_TARGET}"
          curl -sSfL -o alembic.tar.gz \
            "https://github.com/cyberwitchery/alembic/releases/download/${ALEMBIC_VERSION}/${name}.tar.gz"
          tar xzf alembic.tar.gz
          mkdir -p "$HOME/.local/bin"
          mv "${name}/alembic" "$HOME/.local/bin/alembic"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Carp
        uses: carpentry-org/setup-carp@v1

      - name: Run alembic-driven e2e
        run: ALEMBIC=alembic bash test/e2e-alembic.sh
